[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-mfd-solver"
version = "0.1.0"
description = "Adaptive MFD solver with adaptive TPFA-MFD cell classification"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyvista",
    "pyyaml"
]