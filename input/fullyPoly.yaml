mesh: fullyPoly

analytical_field:
  a: -1.0
  b: 0.0
  c: 0.0
  d: 1.0

permeability: identity
boundary_condition: linear

tol_list:
  - 1.0e+2
  - 1.0
  - 1.0e-1
  - 1.0e-2
  - 1.0e-3
  - 1.0e-4

solver:
  inner_product: quasi_tpfa
  solver_type: iterative

reference_flux: projection

saturation:
  enabled: true
  tEnd: 1.0
  dt: 0.05